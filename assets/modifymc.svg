<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14142b" />
      <stop offset="100%" stop-color="#090a14" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#2b2d42" stroke-width="8" />

  <!-- Isometric stylized gear & tool cube -->
  <g transform="translate(256, 256)" filter="url(#glowFilter)">
    <!-- 3D Cube frame -->
    <path d="M 0 -130 L 115 -65 L 115 70 L 0 135 L -115 70 L -115 -65 Z" 
          fill="none" stroke="url(#neonGlow)" stroke-width="16" stroke-linejoin="round" />
    <path d="M 0 -130 L 0 135" stroke="url(#neonGlow)" stroke-width="14" />
    <path d="M 0 0 L 115 -65" stroke="url(#neonGlow)" stroke-width="14" />
    <path d="M 0 0 L -115 -65" stroke="url(#neonGlow)" stroke-width="14" />

    <!-- Configuration Wrench Emblem inside -->
    <path d="M -30 -30 L 30 30 M -10 -40 L -40 -10 M 10 40 L 40 10" 
          stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
    
    <!-- Neon Core Accent -->
    <circle cx="0" cy="0" r="18" fill="#a855f7" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>
</svg>
